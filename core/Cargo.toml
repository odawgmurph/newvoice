[workspace]
resolver = "3"
members = ["newvoice-cli", "newvoice-core", "newvoice-ffi", "uniffi-bindgen"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/odawgmurph/newvoice"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
