[project]
name = "newvoice-harness"
version = "0.0.1"
description = "Validation harness and reference-data tooling for NewVoice (test-only; never shipped)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "numpy>=2.5.5",
    "praat-parselmouth>=0.4.7",
    "pytest>=8",
    "ruff>=0.6",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
