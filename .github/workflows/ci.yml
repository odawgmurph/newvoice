name: CI

# Push runs only on the default branch: on any other branch a push would
# duplicate the pull_request run (different refs, so concurrency can't
# cancel either). Run on a branch without a PR by hand via workflow_dispatch.
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  android:
    name: Android (cargo-ndk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - name: Use the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # API 24 is the first level with the UNPROCESSED audio source.
      - run: >-
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 24
          build -p newvoice-ffi --release --locked

  ios:
    name: iOS (device + simulator)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ios
      - run: cargo build -p newvoice-ffi --release --locked --target aarch64-apple-ios
      - run: cargo build -p newvoice-ffi --release --locked --target aarch64-apple-ios-sim

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: wasm
      - run: cargo build -p newvoice-core --release --locked --target wasm32-unknown-unknown

  harness:
    name: Harness (Praat golden tests, lint, norms check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v5
      # The golden tests build newvoice-cli from core/ (toolchain from
      # core/rust-toolchain.toml).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: harness
      # Downloads pinned by SHA-256 (Hillenbrand vowel recordings and data),
      # kept between runs so the tests don't depend on the mirrors every time.
      - uses: actions/cache@v4
        with:
          path: |
            harness/.cache/h95-alldata.zip
            harness/.cache/vowdata.dat
          key: harness-downloads-2560548591e3-05a4a69e2c6b
      # tests/test_wasm.py runs the WASI build of newvoice-cli under Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Reference norms are up to date
        run: uv run python -m norms.build_norms --check
      - name: LibriSpeech subset is intact
        run: uv run python -m corpus.build_librispeech --check

  app:
    name: App (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
