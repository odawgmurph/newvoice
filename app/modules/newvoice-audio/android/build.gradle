plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.newvoice'
version = '0.1.0'

// src/main/jniLibs (the Rust core for each ABI) and src/main/java/uniffi
// (its Kotlin API) are generated by core/scripts/build-android-libs.sh.
android {
  namespace "app.newvoice.audio"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // UniFFI's Kotlin bindings call the Rust library through JNA (Apache-2.0).
  implementation "net.java.dev.jna:jna:5.17.0@aar"
}
